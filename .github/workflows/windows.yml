name: Windows offline checks and release
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Parse scripts and run data-format self-tests (no game access)
        shell: powershell
        run: ./tests/Test-Offline.ps1
      - name: Build x64 launcher and explicit-file release ZIP
        shell: powershell
        run: ./scripts/New-Release.ps1 -OutputDirectory ./build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BO6-Personal-Progress-Windows
          path: build/BO6_Personal_Progress_EXE.zip
          archive: true
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.event_name == 'release'
    needs: check
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build release from this tag
        shell: powershell
        run: ./scripts/New-Release.ps1 -OutputDirectory ./build
      - name: Attach the compiled portable ZIP to the published release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" ./build/BO6_Personal_Progress_EXE.zip --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) {throw 'Release asset upload failed'}
